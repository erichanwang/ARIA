<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }

    #cursor {
      position: fixed;
      width: 28px; height: 28px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      transition: left 0.04s linear, top 0.04s linear;
    }

    /* White gaze halo: radius 28px, equal to the 28px cursor diameter. */
    #cursor-halo {
      position: fixed;
      width: 56px; height: 56px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.65);
      pointer-events: none;
      display: none;
      transition: left 0.04s linear, top 0.04s linear;
    }

    /* outer ring */
    #cursor::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 43, 43, 0.85);
      box-shadow: 0 0 10px rgba(255,43,43,0.4);
      transition: transform 0.15s;
    }

    /* inner dot */
    #cursor::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff2b2b;
      transform: translate(-50%, -50%);
    }

    /* dwell ring (fills up on hover) */
    #dwell-ring {
      position: fixed;
      width: 36px; height: 36px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    #dwell-ring svg circle.track {
      fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 2.5;
    }
    #dwell-ring svg circle.fill {
      fill: none; stroke: rgba(255,43,43,0.9); stroke-width: 2.5;
      stroke-dasharray: 100; stroke-dashoffset: 100;
      stroke-linecap: round;
      transform-origin: center; transform: rotate(-90deg);
      transition: stroke-dashoffset 0.05s linear;
    }

    /* eye mode: blue */
    #cursor.eye::before { border-color: rgba(43,127,255,0.85); box-shadow: 0 0 10px rgba(43,127,255,0.4); }
    #cursor.eye::after  { background: #2b7fff; }
    #dwell-ring.eye svg circle.fill { stroke: rgba(43,127,255,0.9); }

    /* hand mode: green */
    #cursor.hand::before { border-color: rgba(74,222,128,0.85); box-shadow: 0 0 10px rgba(74,222,128,0.4); }
    #cursor.hand::after  { background: #4ade80; }
    #dwell-ring.hand svg circle.fill { stroke: rgba(74,222,128,0.9); }

    /* click flash */
    @keyframes clickFlash {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }
    #cursor.clicking::before { animation: clickFlash 0.3s ease-out forwards; }
  </style>
</head>
<body>
  <div id="cursor-halo"></div>
  <div id="cursor"></div>
  <div id="dwell-ring">
    <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <circle class="track" cx="18" cy="18" r="16"/>
      <circle class="fill"  cx="18" cy="18" r="16"/>
    </svg>
  </div>

  <script>
    const cursor    = document.getElementById('cursor');
    const cursorHalo = document.getElementById('cursor-halo');
    const dwellRing = document.getElementById('dwell-ring');
    const fillCircle = dwellRing.querySelector('circle.fill');
    const CIRCUMFERENCE = 2 * Math.PI * 16; // r=16

    fillCircle.style.strokeDasharray = CIRCUMFERENCE;
    fillCircle.style.strokeDashoffset = CIRCUMFERENCE;

    // Receive cursor updates via preload-exposed global
    window.ariaIpc.onCursorUpdate((pos) => {
      if (!pos.visible) {
        cursor.style.display = 'none';
        cursorHalo.style.display = 'none';
        dwellRing.style.display = 'none';
        return;
      }
      cursor.style.display = 'block';
      cursorHalo.style.display = 'block';
      cursor.style.left = pos.x + 'px';
      cursor.style.top  = pos.y + 'px';
      cursorHalo.style.left = pos.x + 'px';
      cursorHalo.style.top  = pos.y + 'px';

      // Mode colour class
      cursor.className = pos.state || '';

      // Dwell progress (0-1)
      if (pos.dwell > 0) {
        dwellRing.style.display = 'block';
        dwellRing.style.left = pos.x + 'px';
        dwellRing.style.top  = pos.y + 'px';
        dwellRing.className = pos.state || '';
        const offset = CIRCUMFERENCE * (1 - pos.dwell);
        fillCircle.style.strokeDashoffset = offset;
      } else {
        dwellRing.style.display = 'none';
      }

      // Click flash
      if (pos.clicking) {
        cursor.classList.add('clicking');
        setTimeout(() => cursor.classList.remove('clicking'), 350);
      }
    });
  </script>
</body>
</html>
